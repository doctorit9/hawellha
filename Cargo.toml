[package]
name = "hawellha"
version = "0.2.0"
edition = "2024"
license = "MPL-2.0"
description = "Hawellha (تحويلها) — universal file converter for COSMIC Desktop"
repository = "https://github.com/doctorit9/hawellha.git"
rust-version = "1.93"

[dependencies]
# --- COSMIC / GUI ---
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
open = "5.3.2"
rust-embed = "8.8.0"
tokio = { version = "1.48.0", features = ["full"] }

# --- Data / serialization ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.4"
calamine = "0.36"
rust_xlsxwriter = "0.99"

# --- Images ---
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "bmp",
    "tiff",
    "gif",
    "rayon",
] }

# --- Documents (txt/md -> pdf, pdf -> txt) ---
printpdf = "0.8"
pdf-extract = "0.12"

# --- Archives ---
zip = "2"
tar = "0.4"
flate2 = "1.0"

# --- Misc helpers ---
mime_guess = "2.0"
dirs = "6.0"
notify-rust = "4.18"
thiserror = "2.0"
url = "2.5"

[build-dependencies]
xdgen = "0.1"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
# Remove features if not needed.
features = [
    # About widget for the app
    "about",
    # On app startup, focuses an existing instance if the app is already open
    "single-instance",
    # Markdown widget
    "markdown",
    # QR code widget
    "qr_code",
    # GPU-accelerated rendering
    "wgpu",
    # xdg portal dialogs on Linux
    "xdg-portal"
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }

[profile.release]
# Faster COSMIC link times; re-enable LTO for distribution builds if desired.
lto = false

# --- Native Linux packaging metadata ---------------------------------------
# Used by `cargo deb` (deb) and `cargo generate-rpm` (rpm).
# Install tools once: `cargo install cargo-deb cargo-generate-rpm`
# Build locally: `just deb` / `just rpm` (wrappers below).

[package.metadata.deb]
maintainer = "doctorit9 <https://github.com/doctorit9>"
copyright = "2026, doctorit9 (MPL-2.0)"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
assets = [
  ["target/release/hawellha", "usr/bin/", "755"],
  ["target/xdgen/app.desktop", "usr/share/applications/io.github.doctorit9.Hawellha.desktop", "644"],
  ["target/xdgen/app.metainfo.xml", "usr/share/metainfo/io.github.doctorit9.Hawellha.metainfo.xml", "644"],
  ["resources/icons/hicolor/scalable/apps/icon.svg", "usr/share/icons/hicolor/scalable/apps/io.github.doctorit9.Hawellha.svg", "644"],
]
depends = "libwayland-client0, libxkbcommon0, libgl1, libegl1, libdbus-1-3, libssl3, ffmpeg"
recommends = "xdg-desktop-portal, xdg-desktop-portal-gtk | xdg-desktop-portal-cosmic"
extended-description = """\
Hawellha (تحويلها) — universal file converter for COSMIC Desktop.
Convert data (CSV/XLSX/JSON), images, media (via ffmpeg), documents and archives
with batch queue, history, and persistent settings."""

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/hawellha", dest = "/usr/bin/hawellha", mode = "755" },
  { source = "target/xdgen/app.desktop", dest = "/usr/share/applications/io.github.doctorit9.Hawellha.desktop", mode = "644" },
  { source = "target/xdgen/app.metainfo.xml", dest = "/usr/share/metainfo/io.github.doctorit9.Hawellha.metainfo.xml", mode = "644" },
  { source = "resources/icons/hicolor/scalable/apps/icon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.doctorit9.Hawellha.svg", mode = "644" },
  { source = "LICENSE", dest = "/usr/share/licenses/hawellha/LICENSE", mode = "644" },
]
license = "MPL-2.0"
# cargo-generate-rpm 0.15+ schema:
# [package.metadata.generate-rpm.requires]
# ffmpeg = "*"
